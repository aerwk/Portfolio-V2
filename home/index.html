    --vein:#c4c4c0;                /* f(#3c3c38) */

      display:flex;
      flex-direction:column;
      min-height:100vh;
      min-height:100dvh;

      inset:0;
      overflow:visible;
      pointer-events:none;

    .tr{ order:2; }

       that reserves horizontal room for .br sitting BESIDE it (same row,
       bottom of the viewport) — see design-system.md "Clock readout". Below
       this breakpoint .br is stacked BELOW .bl in flow (order:5 vs 4), not
       beside it, so that reservation is meaningless here and, worse, still
       applies: at 390px wide it collapsed the cluster to ~246px/~214px
       (sentence), wrapping the ~130-char sentence to 9-10 lines and
       squeezing hero.js's phone band. Caught by Playwright at 390, not by
       inspection. Explicitly uncapped on phones — same as before this
       measure existed. */
    .bl{ order:4; margin-top:auto; max-width:none; }
    .n5i-clocksentence{ max-width:none; } /* same reasoning as .bl above; this rule is same-specificity as instruments.css's but wins on cascade order (inline <style> loads after the linked stylesheet) */
    /* instruments.css positions .n5i-readouts absolute, top:0, left:272u —
       tuned to sit above "Infrastructure" on line 1 of the DESKTOP wrap.
       Below 768px .n5i-clocksentence is uncapped (line above) so line 1 is
       just "DevOps &" (see design-system.md / the 2026-09-09 measurements)
       — "Infrastructure" wraps to its own line at the left margin, nowhere
       near x=272u, so the desktop anchor points at empty space beside the
       clock instead of at any word.
       First attempt re-anchored to the PARAGRAPH's own bottom edge
       (top:100%) — wrong: .n5i-clocksentence is still position:relative
       here, so its own auto height (driven only by its in-flow text) is
       what "100%" measures against, and an absolutely positioned child
       never grows that height back to include itself. The result was 5px
       of readouts hanging past .corner.bl's own (also auto-height) bottom
       edge, into the gap above .br's nav — confirmed by measuring
       blRect.bottom - readoutsRect.bottom = -5 at 390px. Anchoring to the
       PARAGRAPH can't work at all on this breakpoint: whatever the
       paragraph's real height turns out to be (it varies: 5 lines here,
       could be more with a narrower phone), the readouts are outside it
       by construction.
       Fix: fall through to .corner.bl itself as the containing block
       instead (position:static here undoes .n5i-clocksentence's own
       position:relative; .corner already has position:relative one rule
       up) and pin bottom/right to its PADDING edge — inset-y/inset-x get
       us from that edge back to the same coordinate space every other
       in-flow child (tz-label included) is drawn in, so this sits beside
       tz-label, inside the box, however tall the paragraph ends up. */
    .n5i-clocksentence{ position:static; }
    .n5i-readouts{ top:auto; left:auto; right:var(--n5i-inset-x, 12px); bottom:var(--n5i-inset-y, 12px); }
    .br{ order:5; }
    /* Links: all five pills on ONE centred row (About Projects Blog EMAIL
       Login — tighter 8px pill padding so they fit 366px), the divider rule
       dropped, the icon row centred underneath. */
    .br nav{

      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:4px;
    }
    /* five pills must fit one 366px row even with a wider fallback font or
       a large system font: tighter padding + gap, labels never wrap */
    .br nav > .pill:not(.ico){ padding:3px 6px; flex:0 1 auto; min-width:0; }
    .br nav > .pill .pill-l{ white-space:nowrap; }
    .br nav{ gap:2px; }
    .n5i-nav-rule{ display:none; }
    .n5i-socials{
      order:10;
      flex-basis:100%;
      justify-content:center;
      gap:4px;
      margin:8px 0 0;
    }
  }

  .role{ white-space:nowrap; }
  @media (max-width: 767px){ .tl{ align-self:flex-start; } }

<script>
(function(){
  'use strict';

  var REDUCED = false;
  try { REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch (e) { REDUCED = false; }

  /* the top-right telemetry corner is gone from ericli.n5hq.me (it's a
     homelab-specific instrument reserved for a future n5hq.me page) — three
     corners now, staggered evenly over the same 0-360ms span. c-theme (the
     theme toggle) is a fourth, paired at the same 0ms delay as c-tl since
     both sit in the header row and read as one group appearing together. */
  var corners = [
    { el: document.getElementById('c-tl'), delay: 0 },
    { el: document.getElementById('c-theme'), delay: 0 },
    { el: document.getElementById('c-bl'), delay: 180 },
    { el: document.getElementById('c-br'), delay: 360 }
  ].filter(function (c) { return !!c.el; });

  /* Theme toggle (ninja = dark, default; flashbang = light, invert(1) hue-rotate(180deg)
     on <html>, set in the inline <head> script + the CSS rule near the top of this
     page's <style>). Wired here, independent of the corner reveal choreography above,
     so it's interactive as soon as the script runs rather than waiting on
     fonts.ready. */
  (function initThemeToggle(){
    var THEME_KEY = 'n5-theme';
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    function currentTheme(){
      return document.documentElement.getAttribute('data-theme') === 'flashbang' ? 'flashbang' : 'ninja';
    }
    function syncThemeColorMeta(theme){
      try {
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'flashbang' ? '#ecede9' : '#12130f');
      } catch (e) {}
    }
    function syncButton(theme){
      var isFlashbang = theme === 'flashbang';
      btn.setAttribute('aria-pressed', isFlashbang ? 'true' : 'false');
      btn.setAttribute('aria-label', isFlashbang ? 'Switch to ninja mode' : 'Switch to flashbang mode');
    }
    var theme = currentTheme();
    syncButton(theme);
    syncThemeColorMeta(theme);
    btn.addEventListener('click', function(){
      var next = currentTheme() === 'flashbang' ? 'ninja' : 'flashbang';
      document.documentElement.setAttribute('data-theme', next);
      try { window.localStorage.setItem(THEME_KEY, next); } catch (e) {}
      syncButton(next);
      syncThemeColorMeta(next);
    });
  })();

  /* One Web Animations API Animation per corner (transform+opacity only,
     500ms ease-out, staggered per corner) rather than a CSS transition —
     WAAPI gives shot tooling a deterministic, scrubbable timeline
     (__n5RevealAt(ms) / __n5RevealPlay()), which a CSS transition can't
     offer: a headless screenshot's own round-trip latency can land after
     a transition has already finished, making it impossible to capture
     mid-reveal. */
  var revealAnims = [];

  function revealCorners(){
    if (REDUCED) {
      var k;
      for (k = 0; k < corners.length; k++) {
        corners[k].el.style.opacity = '1';
        corners[k].el.style.transform = 'none';
      }
      return;
    }
    var i;
    for (i = 0; i < corners.length; i++) {
      var c = corners[i];
      var anim = c.el.animate(
        [
          { opacity: .15, transform: 'translateY(10px)' },
          { opacity: 1, transform: 'none' }
        ],
        { duration: 500, delay: c.delay, easing: 'ease-out', fill: 'both' }
      );
      revealAnims.push(anim);
    }
  }

  window.__n5RevealAt = function(ms){
    var i;
    for (i = 0; i < revealAnims.length; i++) {
      revealAnims[i].pause();
      revealAnims[i].currentTime = ms;
    }
  };
  window.__n5RevealPlay = function(){
    var i;
    for (i = 0; i < revealAnims.length; i++) revealAnims[i].play();
  };

  /* Run the SAME fonts.ready + double-rAF barrier instruments.js uses
     internally, then, inside that one callback: mount the hero (arming
     its own internal fonts.ready + double-rAF gate for the assembly clock
     — at most two more frames, which is fine), mount the instruments, and
     fire the corner reveal — all three choreography tracks start from the
     same tick instead of racing three independent fonts.ready listeners. */
  function whenReady(cb){
    function afterPaint(){
      requestAnimationFrame(function(){ requestAnimationFrame(cb); });
    }
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(afterPaint, afterPaint);
    } else {
      afterPaint();
    }
  }

  var stage = document.getElementById('hero-stage');

  whenReady(function(){
    if (window.N5Hero) {
      window.N5Hero.mount(stage);
      window.N5Hero.onState(function(nodesUp){
        if (window.N5Instruments) window.N5Instruments.setClusterState(nodesUp);
      });
    } else {
      console.error('N5Hero failed to load');
    }

    revealCorners();

    if (window.N5Instruments) {
      window.N5Instruments.mount(document);
      window.N5Instruments.setClusterState(3);
    }

    window.__n5ReadyAt = performance.now();
    window.__n5PageReady = true;
  });
})();
</script>

<script>
(function(){
  /* Wordmark lockup, SVG era (Eric, 2026-09-24): rest is the static SVG, hover is the violet
     one. Enter/focus adds .lk-neon, which runs the CSS neon-strike keyframes on .lk-hover
     (instruments.css); animationend swaps .lk-neon -> .lk-hov, which just holds the violet
     mark lit. Exit is never animated — leave/blur strip both classes synchronously so a
     re-enter always restarts the strike clean. Skipped entirely under reduced motion, where
     .lk-armed is never added and plain CSS :hover/:focus-visible does the swap instead. */
  document.querySelectorAll('.n5i-lockup.lk-armed').forEach(function(brand){
    brand.addEventListener('animationend', function(){
      if (brand.classList.contains('lk-neon')) { brand.classList.remove('lk-neon'); brand.classList.add('lk-hov'); }
    });
    var over = function(){ brand.classList.remove('lk-hov'); brand.classList.add('lk-neon'); };
    var out = function(){ brand.classList.remove('lk-neon'); brand.classList.remove('lk-hov'); };
    brand.addEventListener('mouseenter', over); brand.addEventListener('mouseleave', out);
    brand.addEventListener('focus', over); brand.addEventListener('blur', out);
  });
})();
</script>
