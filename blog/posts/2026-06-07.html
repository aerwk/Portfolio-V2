  <h1 class="post-title-h">Home Assistant Goes Public</h1>
  <p class="post-chips label">Homelab · 2026-06-07 · Saturday · 2:17 AM · 2 min read · 50% AI · Eric Li</p>

  <nav class="post-prevnext" aria-label="Post navigation"><span class="pn-prev"></span><span class="pn-next"><a class="pill" href="/blog/posts/2026-06-08.html" title="Monitoring Stack and Website Launch"><span class="pill-l">Next ›</span><span class="pill-c" aria-hidden="true">Next ›</span></a></span></nav>

  <article class="prose">
<p>The goal for the session was simple: get Home Assistant accessible from outside the network without opening ports. Added <code>cloudflared</code> as a Docker service in the Home Assistant compose file, configured a Cloudflare Zero Trust tunnel to route <code>ha.n5hq.me</code> to <code>localhost:8123</code>, and expected it to just work. It did not just work.</p>
<h2>The Silent 502</h2>
<p>The first 502 Bad Gateway was easy enough — the service URL in the Cloudflare dashboard was set to <code>homeassistant:8123</code> (the container name). Since both containers run with <code>network_mode: host</code>, Docker's internal DNS doesn't resolve container names — that only works on bridge networks. Changed it to <code>http://localhost:8123</code> and restarted.</p>
<p>Still 502. But this time cloudflared wasn't logging anything at all. No requests showing up, no errors, nothing. The tunnel showed connected but the logs were completely silent. That silence is what cost the most time — it looked like traffic wasn't arriving at all, and without evidence of where it was failing there wasn't much to go on. Eventually added <code>--protocol http2 --loglevel debug</code> to the cloudflared command. With debug logging on, the picture became clear: requests <em>were</em> arriving, but HA was returning 400.</p>
<h2>The 400 Stack</h2>
<p>Three causes, all stacked on top of each other. First, <code>trusted_proxies</code> was set to <code>x.x.0.3</code> — an old Docker bridge IP that was no longer valid. Second, when correcting it, typed <code>172.0.0.1</code> instead of <code>127.0.0.1</code>. One wrong digit, another restart, still broken. Third, <code>external_url</code> wasn't set at all — Home Assistant rejects requests where the <code>Host</code> header doesn't match a configured external URL, so every request through <code>ha.n5hq.me</code> was being rejected regardless.</p>
<p>Fixed all three: <code>trusted_proxies</code> corrected to <code>127.0.0.1</code> and <code>::1</code>, <code>external_url</code> set to <code>https://ha.n5hq.me</code>, HA restarted. Tunnel came up cleanly.</p>
<h2>What's Next</h2>
<ul>
<li class="task-open">Expose Immich the same way — same cloudflared instance, second public hostname</li>
<li class="task-open">Consider Cloudflare Access in front of HA for authentication layer</li>
</ul>
<p>About 1.5 hours total — almost all of it on the silent 502 before debug logging was enabled. The lesson that stuck: on a <code>host</code> network, you always use <code>localhost</code>, and debug logging should be the first thing you turn on when there's nothing to look at.</p>
